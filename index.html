*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{background:var(--black);color:#fff;font-family:Inter,sans-serif}
nav{position:sticky;top:0;z-index:100;background:rgba(0,0,0,.96);border-bottom:2px solid var(--gold);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}

.hero{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px;background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.96)),url('MOTHER_LOGO_FINAL.jpg') center/cover}
.hero .logo{width:210px;height:210px;border-radius:26px;border:4px solid var(--gold);box-shadow:0 0 70px rgba(212,175,55,.6);background:#000;object-fit:contain;padding:14px}
.hero h1{font-family:Cinzel;color:var(--gold);font-size:clamp(32px,6vw,64px);line-height:.95;margin:24px 0 10px;text-shadow:0 0 30px gold}
.btn{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#000;padding:15px 36px;border-radius:40px;font-family:Cinzel;font-weight:900;letter-spacing:2px;text-decoration:none;display:inline-block}
.wrap{max-width:1350px;margin:0 auto;padding:70px 20px}
.wrap h2{font-family:Cinzel;color:var(--gold);text-align:center;font-size:clamp(28px,4vw,44px)}
.sub{text-align:center;color:#666;letter-spacing:4px;font-size:11px;margin:10px 0 45px}
.kings{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px}
.king{background:linear-gradient(160deg,#122c1e,#050805);border:2px solid var(--gold);border-radius:22px;overflow:hidden}
.king.correct{border-color:#00ff88}
